name = "maintenance-ai-toolkit-staging"
main = "worker.js"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
AI_PROVIDER = "cloudflare"
CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "2026102919"

[ratelimits.simple]
limit = 10
period = 60

[ai]
binding = "AI"
