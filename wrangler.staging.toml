name = "maintenance-ai-toolkit-staging"
main = "worker.js"
compatibility_date = "2026-10-21"
workers_dev = true

[vars]
AI_PROVIDER = "cloudflare"
CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
AI_DIAGNOSTICS_DEBUG = "true"
P4_STAGING_ENABLED = "true"

[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "maintenance-community-staging"
database_id = "6d8edd48-85dd-48a5-be63-fa031af9f18a"
migrations_dir = "migrations"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "2026102919"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "P4_RATE_LIMITER"
namespace_id = "20261101205301"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "P4_UPLOAD_RATE_LIMITER"
namespace_id = "20261101205302"

[ratelimits.simple]
limit = 5
period = 60

[ai]
binding = "AI"
