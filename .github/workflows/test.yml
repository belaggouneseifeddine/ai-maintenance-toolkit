name: Maintenance Toolkit tests

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run unit and integration tests
        run: node --test tests/*.test.cjs
      - name: Check document library JavaScript syntax
        run: |
          node --check document-library-core.js
          node --check document-library.js
