name: Android local assistant integration CI

on:
  push:
    branches:
      - "feature/android-local-llm-host-poc"
      - "feature/android-local-assistant-integration-2026-11-19"
      - "refactor/local-assistant-diagnostic-pdf-2026-11-19"
    paths:
      - "android-local-host/**"
      - "*.js"
      - "*.html"
      - "*.css"
      - "*.json"
      - "scripts/vendor-document-runtime.sh"
      - "vendor/**"
      - ".github/workflows/android-local-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble Android debug APK
        working-directory: android-local-host
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-local-assistant-debug
          path: android-local-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
