name: Cloudflare AI staging integration test

on:
  push:
    branches: [feature/openai-primary-provider]
    paths:
      - "worker.js"
      - "normalization.js"
      - "providers/**"
      - "knowledge/**"
      - "wrangler.staging.toml"
      - "wrangler.toml"
      - "scripts/staging-smoke.mjs"
      - "scripts/staging-smoke.mjs"
      - "tests/cloudflare-provider.test.cjs"
      - "tests/worker-contract.test.cjs"
      - ".github/workflows/cloudflare-ai-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-ai-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all repository tests
        run: node --test tests/*.test.cjs
      - name: Validate staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.staging.toml
      - name: Allow staging Worker deployment to propagate
        run: sleep 10
      - name: Verify full API path against real Cloudflare model
        env:
          STAGING_WORKER_URL: https://maintenance-ai-toolkit-staging.maintenance-ai-toolkit-api-seif.workers.dev
        run: node scripts/staging-smoke.mjs
