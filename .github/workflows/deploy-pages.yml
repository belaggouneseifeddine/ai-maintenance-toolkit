name: Deploy Maintenance AI Toolkit to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          if [ -f cv.html ]; then cp cv.html _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi
          if [ -d knowledge ]; then cp -R knowledge _site/; fi
          if [ -f SAFETY.md ]; then cp SAFETY.md _site/; fi
          if [ -f icon-192.png ]; then cp icon-192.png _site/; fi
          if [ -f icon-512.png ]; then cp icon-512.png _site/; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
