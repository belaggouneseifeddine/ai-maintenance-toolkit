name: Deploy Maintenance AI Toolkit to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for diagnostic tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test local diagnostic engine
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          required_runtime_assets="diagnostic-flows.js normalization.js bayesian-engine.js diagnostic-engine.js engineering-core.js agent-core.js evidence-reasoning.js evidence-reasoning-ui.js diagnostic-evidence-register.json agent-ui.js diagnostic-session.js diagnostic-session-ui.js oem-lookup.js faults.json i18n.js maintenance-v03.js knowledge-review.js answer-tools.js ux-redesign.js navigation-redesign.js"
          for asset in $required_runtime_assets; do
            test -f "$asset" || { echo "Missing required runtime asset: $asset"; exit 1; }
          done
          cp index.html manifest.json sw.js $required_runtime_assets icon.svg maintenance-v03.css decision-trees.json ux-redesign.css _site/
          if [ -f cv.html ]; then cp cv.html _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi
          if [ -d knowledge ]; then cp -R knowledge _site/; fi
          if [ -f SAFETY.md ]; then cp SAFETY.md _site/; fi
          if [ -f icon-192.png ]; then cp icon-192.png _site/; fi
          if [ -f icon-512.png ]; then cp icon-512.png _site/; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout source for live smoke test
        uses: actions/checkout@v4

      - name: Smoke-test published app and Worker
        run: node scripts/smoke-test-live.mjs
