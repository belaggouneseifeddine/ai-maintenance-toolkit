name: Maintenance Toolkit CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maintenance-toolkit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run diagnostic and contract tests
        run: node --test tests/*.test.cjs
      - name: Run application quality checks
        run: node scripts/quality-check.mjs
      - name: Check patch whitespace
        run: git diff --check
