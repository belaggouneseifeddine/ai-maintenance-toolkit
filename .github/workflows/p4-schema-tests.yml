name: P4 schema tests

on:
  pull_request:
    paths:
      - "migrations/**"
      - "scripts/test-p4-schema.py"
      - "scripts/test-p4-anonymous-profile.py"
      - "scripts/test-p4-community-api.mjs"
      - "scripts/test-p4-pdf-extraction.py"
      - "scripts/extract-pdf-pages.py"
      - "p4-community.js"
      - "p4-profile.js"
      - ".github/workflows/p4-schema-tests.yml"
  push:
    branches:
      - "feature/p4-global-community-knowledge"
      - "fix/p4-atomic-storage-quotas-2026-11-05"
    paths:
      - "migrations/**"
      - "scripts/test-p4-schema.py"
      - "scripts/test-p4-anonymous-profile.py"
      - "scripts/test-p4-community-api.mjs"
      - "p4-community.js"
      - "p4-profile.js"
      - ".github/workflows/p4-schema-tests.yml"

permissions:
  contents: read

jobs:
  sqlite-schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF extraction test dependency
        run: python -m pip install --disable-pip-version-check "pypdf>=5,<7"
      - name: Validate P4 migration and workflow invariants
        run: |
          python scripts/test-p4-schema.py
          python scripts/test-p4-anonymous-profile.py
          node --check p4-profile.js
          node --test scripts/test-p4-community-api.mjs
          python scripts/test-p4-pdf-extraction.py
