name: Extract PDF pages

on:
  push:
    branches:
      - feature/p4-global-community-knowledge
    paths:
      - "knowledge/documents/**/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-pdf-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v5
        with:
          ref: feature/p4-global-community-knowledge
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF text extractor
        run: python -m pip install --disable-pip-version-check "pypdf>=5,<7"
      - name: Extract text with page numbers
        run: python scripts/extract-pdf-pages.py
      - name: Commit extraction sidecars
        run: |
          if git diff --quiet -- knowledge/extracted; then
            echo "No extraction output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/extracted
          git commit -m "P4: update extracted PDF page text"
          git push origin HEAD:feature/p4-global-community-knowledge
