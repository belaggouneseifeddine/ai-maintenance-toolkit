name: Android local model host CI

on:
  pull_request:
    paths:
      - "android-local-host/**"
      - ".github/workflows/android-local-host-ci.yml"
  push:
    branches:
      - "feature/android-local-llm-host-poc"
    paths:
      - "android-local-host/**"
      - ".github/workflows/android-local-host-ci.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble Android debug APK
        working-directory: android-local-host
        run: gradle :app:assembleDebug --no-daemon
