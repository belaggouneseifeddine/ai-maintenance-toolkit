name: Diagnostic and worker contract tests
on:
  push:
    branches:
      - feature/dynamic-diagnostic-agent-knowledge-v1
  pull_request:
    branches:
      - main
jobs:
  diagnostic-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/diagnostic-session.test.cjs tests/worker-contract.test.cjs
