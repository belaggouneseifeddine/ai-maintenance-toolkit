name: Maintenance Toolkit Quality Checks

on:
  push:
    branches: [main, "chore/**", "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Static safety and integrity checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app and backend guardrails
        run: node scripts/quality-check.mjs
      - name: Smoke-test published app and Worker API
        run: node scripts/smoke-test-live.mjs
