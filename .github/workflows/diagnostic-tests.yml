name: Diagnostic engine tests

on:
  push:
    paths:
      - "diagnostic-engine.js"
      - "engineering-core.js"
      - "worker.js"
      - "normalization.js"
      - "knowledge/**"
      - "scripts/**"
      - "wrangler.toml"
      - ".github/workflows/validate-knowledge.yml"
      - "maintenance-v03.js"
      - "index.html"
      - "sw.js"
      - "faults.json"
      - "tests/**"
      - ".github/workflows/diagnostic-tests.yml"
  pull_request:
    paths:
      - "diagnostic-engine.js"
      - "worker.js"
      - "normalization.js"
      - "knowledge/**"
      - "scripts/**"
      - "wrangler.toml"
      - ".github/workflows/validate-knowledge.yml"
      - "maintenance-v03.js"
      - "index.html"
      - "sw.js"
      - "faults.json"
      - "tests/**"
      - ".github/workflows/diagnostic-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run diagnostic regression tests
        run: node --test tests/*.test.cjs
