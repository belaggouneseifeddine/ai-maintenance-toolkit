name: Deploy Maintenance AI Toolkit API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'providers/**/*.mjs'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: maintenance-ai-toolkit-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.toml

      - name: Check whether optional OpenAI secret is supplied
        id: openai-secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provided=true" >> "$GITHUB_OUTPUT"
          else
            echo "provided=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update OpenAI secret when supplied
        if: steps.openai-secret.outputs.provided == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY --config wrangler.toml

      - name: Verify selected provider configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          provider="$(sed -n 's/^AI_PROVIDER = "\(.*\)"/\1/p' wrangler.toml | head -n 1)"
          case "$provider" in
            cloudflare)
              grep -Eq '^\[ai\]' wrangler.toml
              grep -Eq '^binding = "AI"' wrangler.toml
              grep -Eq '^CLOUDFLARE_AI_MODEL = "' wrangler.toml
              echo "Cloudflare Workers AI selected; no separate provider API key is required."
              ;;
            openai)
              secrets="$(wrangler secret list --config wrangler.toml)"
              printf '%s' "$secrets" | grep -Eq 'OPENAI_API_KEY' || {
                echo "OpenAI is selected but OPENAI_API_KEY is missing."
                exit 1
              }
              ;;
            gemini)
              secrets="$(wrangler secret list --config wrangler.toml)"
              printf '%s' "$secrets" | grep -Eq 'GEMINI_API_KEY|AI_API_KEY' || {
                echo "Gemini is selected but GEMINI_API_KEY / AI_API_KEY is missing."
                exit 1
              }
              ;;
            *)
              echo "Unsupported AI_PROVIDER: $provider"
              exit 1
              ;;
          esac
