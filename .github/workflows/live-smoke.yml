name: Live API and published app smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/smoke-test-live.mjs'
      - '.github/workflows/live-smoke.yml'
      - 'index.html'
      - 'worker.js'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-ai-toolkit-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check published GitHub Pages and configured Worker health
        run: node scripts/smoke-test-live.mjs
