name: Maintenance Toolkit Quality Checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-toolkit-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run diagnostic and agent tests
        run: node --test tests/*.test.cjs

      - name: Run Worker provider and CORS tests
        run: |
          if compgen -G "tests/*.test.mjs" > /dev/null; then
            node --experimental-default-type=module --test tests/*.test.mjs
          else
            echo "No Worker module tests are present on this ref."
          fi

      - name: Check JavaScript syntax
        run: |
          for file in \
            normalization.js \
            diagnostic-engine.js \
            diagnostic-flows.js \
            engineering-core.js \
            agent-core.js \
            agent-ui.js \
            diagnostic-chat.js \
            assistant-session-contract.js \
            assistant-tool-registry.js \
            assistant-local-orchestrator.js \
            assistant-local-tools.js \
            bayesian-engine.js \
            document-semantic-search.js \
            document-library-core.js \
            document-library.js \
            document-retrieval-adapter.js \
            document-review-workspaces.js \
            diagnostic-document-evidence.js \
            diagnostic-casebook.js \
            app-legacy.js \
            sw.js; do
            node --check "$file"
          done
          node --input-type=module --check < worker.js
          bash -n scripts/vendor-document-runtime.sh
